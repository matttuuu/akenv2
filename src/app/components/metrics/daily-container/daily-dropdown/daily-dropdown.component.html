<div class="layout-main">
  <div class="dropdown-wrapper">
    <label for="hotelSelect"></label>
    <select
      id="hotelSelect"
      class="dropdown"
      [(ngModel)]="selectedHotel"
      (ngModelChange)="onHotelChangeDB($event)"
    >
      <option [ngValue]="null" disabled selected>Select a hotel</option>
      <option *ngFor="let hotel of hotels" [ngValue]="hotel">
        {{ hotel.name }}
      </option>
    </select>
  </div>
  

  <!-- Preview del hotel seleccionado -->
  <div class="selected-value" *ngIf="selectedHotel">
    Selected Hotel: <strong>{{ selectedHotel.name }}</strong>
  </div>
</div>
