  <div class="main-content">
    <div class="central-content">
      <div class="central-content title" *ngIf="currentUser$ | async as user">
        <h2>Welcome {{ user.displayName || user.email }}</h2>
        <p>Haz click en el botón para cerrar sesión</p>
      </div>

      <div class="tabs-container-inside">
        <!---->
        <ul class="tabs">
          <li (click)="selectTab('live')" [class.active]="activeTab === 'live'">
            Live
          </li>
          <li
            (click)="selectTab('daily')"
            [class.active]="activeTab === 'daily'"
          >
            Daily
          </li>
        </ul>
      </div>
      <!---->
      <section
        class="metrics-section live-metrics"
        *ngIf="activeTab === 'live'"
      >
        <h3>Live Metrics</h3>
        <app-hotel-dropdown></app-hotel-dropdown> 
        <p style="font-size: 10px">Last updated:</p>
        <app-total-rooms></app-total-rooms>
        <app-clean-dirty></app-clean-dirty>
        <div class="graphs-live-section-1">
          <app-check-ins-outs></app-check-ins-outs>
          <app-reservations-info></app-reservations-info>
        </div>
        <app-adr></app-adr>
      </section>

      <section
        class="metrics-section daily-metrics"
        *ngIf="activeTab === 'daily'"
      >
        <h3>Daily Metrics</h3>
        <p style="font-size: 10px; margin-top: -7px;">Showing data from previous day</p>
        <app-daily-dropdown></app-daily-dropdown>
        <!--Seccion de metricas dia previo-->
        <app-previous-day></app-previous-day>
        <app-calendar (selectModeChanged)="onCalendarModeChange($event)"></app-calendar>
        <app-users-test></app-users-test>

        <!-- <button (click)="openModal()">Abrir ventana modal</button> -->

        <div class="overlay" *ngIf="showCompareModal"> <!--Overlay de modal-->
          <div class="compare-modal"> <!-- Ventana modal de comparacion -->
            <h2>Modal simple</h2>

            <app-compare-range-card *ngIf="selectedRangeMode === 'range'" ></app-compare-range-card> <!--Agregar el (click) !!!!!!!!!!!!!!!!!!!!!!!!-->
            <app-single-day-card *ngIf="selectedRangeMode === 'single'" ></app-single-day-card> <!--Clean dirty y check ins/outs para probar-->
           
            <!-- <app-clean-dirty></app-clean-dirty>
            <app-check-ins-outs></app-check-ins-outs>
             -->
            <p>Hecho solo con estilos y divs</p>
            <button (click)="closeModal()">Cerrar</button>
          </div>
        </div>
      </section>
    </div>
  </div>
</div>
